[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gcals"
version = "0.1.0"
description = "Gradient Controlled Adaptive Label Smoothing"
requires-python = ">=3.8"

# Crucial fix: Force setuptools to treat root modules as the package
[tool.setuptools]
py-modules = ["utils", "data_loaders"]
